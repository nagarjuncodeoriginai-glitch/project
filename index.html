<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nova | AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: rgba(255, 255, 255, 0.92);
            --text-secondary: rgba(255, 255, 255, 0.55);
            --text-muted: rgba(255, 255, 255, 0.3);
            --accent: rgba(139, 92, 246, 0.8);
            --accent-glow: rgba(139, 92, 246, 0.15);
            --success: rgba(74, 222, 128, 0.8);
            --radius: 16px;
        }


        body {
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            width: 100vw;
        }

        /* ============ FULLSCREEN LAYOUT ============ */
        .app-container {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Ambient background gradient */
        .ambient-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 30%, rgba(139,92,246,0.06) 0%, transparent 60%),
                        radial-gradient(ellipse at 30% 70%, rgba(59,130,246,0.04) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, rgba(168,85,247,0.03) 0%, transparent 50%);
            animation: ambientPulse 8s ease-in-out infinite alternate;
        }
        @keyframes ambientPulse {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        /* ============ AVATAR AREA ============ */
        .avatar-area {
            position: relative;
            z-index: 10;
        }

        #avatarCanvas {
            display: block;
            border-radius: 24px;
            max-height: 85vh;
            width: auto;
            filter: drop-shadow(0 0 60px rgba(139,92,246,0.08));
        }


        /* ============ BOTTOM CONTROLS BAR ============ */
        .controls-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 20px 32px 28px;
            background: linear-gradient(to top, rgba(10,10,15,0.95) 0%, rgba(10,10,15,0.7) 60%, transparent 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* Waveform */
        .waveform {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 32px;
            padding: 0 16px;
        }
        .waveform-bar {
            width: 3px;
            height: 4px;
            background: var(--accent);
            border-radius: 2px;
            transition: height 0.05s ease;
        }

        /* Mic button */
        .mic-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 24px rgba(139,92,246,0.3);
            position: relative;
        }
        .mic-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 32px rgba(139,92,246,0.5);
        }
        .mic-btn:active { transform: scale(0.95); }
        .mic-btn svg { width: 22px; height: 22px; fill: white; }
        .mic-btn.active {
            animation: micPulse 1.5s ease-in-out infinite;
        }
        @keyframes micPulse {
            0%, 100% { box-shadow: 0 4px 24px rgba(139,92,246,0.3); }
            50% { box-shadow: 0 4px 40px rgba(139,92,246,0.6); }
        }

        /* Subtitle */
        .subtitle-area {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 90;
            max-width: 600px;
            width: 90%;
            text-align: center;
        }
        #subtitle {
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--text-primary);
            line-height: 1.6;
            background: rgba(10,10,15,0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 24px;
            min-height: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #subtitle:not(:empty) { opacity: 1; }


        /* ============ STATUS INDICATOR (minimal) ============ */
        .status-pill {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: all 0.3s ease;
        }
        .status-pill.active .status-dot {
            background: var(--success);
            box-shadow: 0 0 8px rgba(74,222,128,0.5);
            animation: dotPulse 2s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%, 100% { opacity: 0.7; } 50% { opacity: 1; }
        }

        /* ============ HIDDEN CAMERA (for detection) ============ */
        .hidden-camera {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 120px;
            height: 90px;
            border-radius: 12px;
            overflow: hidden;
            opacity: 0.15;
            z-index: 50;
            transition: opacity 0.3s ease;
            border: 1px solid var(--glass-border);
        }
        .hidden-camera:hover { opacity: 0.6; }
        .hidden-camera video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }


        /* ============ LOADING SCREEN ============ */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 0.6s ease;
        }
        .loader-ring {
            width: 48px;
            height: 48px;
            border: 2px solid rgba(139,92,246,0.15);
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text {
            margin-top: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }
        .loader-sub {
            margin-top: 6px;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 768px) {
            #avatarCanvas { max-height: 70vh; }
            .controls-bar { padding: 16px 20px 24px; }
            .subtitle-area { bottom: 90px; }
            .hidden-camera { width: 80px; height: 60px; }
        }
    </style>
</head>
<body>

<!-- Loading -->
<div id="loading-screen">
    <div class="loader-ring"></div>
    <div class="loader-text">Nova</div>
    <div class="loader-sub">Powered by Krutrim AI</div>
</div>

<!-- App -->
<div class="app-container">
    <div class="ambient-bg"></div>
    <div class="avatar-area">
        <canvas id="avatarCanvas" width="520" height="700"></canvas>
    </div>
</div>

<!-- Status indicator -->
<div class="status-pill" id="statusIndicator">
    <div class="status-dot"></div>
    <span>Tap mic to talk</span>
</div>

<!-- Hidden camera for detection -->
<div class="hidden-camera">
    <video id="cameraFeed" autoplay playsinline muted></video>
</div>

<!-- Subtitle -->
<div class="subtitle-area">
    <div id="subtitle"></div>
</div>


<!-- Bottom controls -->
<div class="controls-bar">
    <div class="waveform">
        <div class="waveform-bar"></div><div class="waveform-bar"></div>
        <div class="waveform-bar"></div><div class="waveform-bar"></div>
        <div class="waveform-bar"></div><div class="waveform-bar"></div>
        <div class="waveform-bar"></div><div class="waveform-bar"></div>
        <div class="waveform-bar"></div><div class="waveform-bar"></div>
        <div class="waveform-bar"></div><div class="waveform-bar"></div>
        <div class="waveform-bar"></div><div class="waveform-bar"></div>
        <div class="waveform-bar"></div><div class="waveform-bar"></div>
        <div class="waveform-bar"></div><div class="waveform-bar"></div>
        <div class="waveform-bar"></div><div class="waveform-bar"></div>
    </div>
    <button class="mic-btn" id="micBtn" title="Voice Input">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
    </button>
    <div class="waveform">
        <div class="waveform-bar"></div><div class="waveform-bar"></div>
        <div class="waveform-bar"></div><div class="waveform-bar"></div>
        <div class="waveform-bar"></div><div class="waveform-bar"></div>
        <div class="waveform-bar"></div><div class="waveform-bar"></div>
        <div class="waveform-bar"></div><div class="waveform-bar"></div>
        <div class="waveform-bar"></div><div class="waveform-bar"></div>
        <div class="waveform-bar"></div><div class="waveform-bar"></div>
        <div class="waveform-bar"></div><div class="waveform-bar"></div>
        <div class="waveform-bar"></div><div class="waveform-bar"></div>
        <div class="waveform-bar"></div><div class="waveform-bar"></div>
    </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
